# Intégration continue : chaque PR et chaque push sur main.
# Tests en matrice, une entrée par unité (paquet, service, gateway, frontend : scripts/ci/unites.mjs). Sur une
# PR, seules les unités touchées sont testées (matrice par chemins) ; sur main, toutes. Chaque service est installé
# et testé dans son seul dossier (docs/adr/0023). Suite de bout en bout sur la pile compose (docs/adr/0048).
# Le déploiement continu est à réécrire pour les microservices (docs/adr/0048) ; Terraform reste gelé.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Paquets partagés livrés compilés (dist/ versionné à jour, docs/adr/0025)
        run: |
          npx tsc -b packages/logger packages/config packages/http-kit
          test -z "$(git status --porcelain -- packages/logger/dist packages/config/dist packages/http-kit/dist)"             || { git status --short -- packages/*/dist; echo "dist/ obsolète : node scripts/sync-packages.mjs, puis committer"; exit 1; }
      - run: npm audit --omit=dev --audit-level=high
      - name: Scripts de déploiement et de retour arrière
        run: bash infra/deploy/test/deploy.test.sh

  unites:
    name: Liste des unités testées
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.liste.outputs.matrice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: liste
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            echo "matrice=$(node scripts/ci/unites.mjs --depuis "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
          else
            echo "matrice=$(node scripts/ci/unites.mjs)" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests · ${{ matrix.name }}
    needs: [unites]
    # PR sans unité touchée (documentation seule) : aucun test à lancer.
    if: needs.unites.outputs.matrice != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.unites.outputs.matrice) }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: attesta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attesta_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Les tests d'intégration échouent (et ne sont pas ignorés) si la base manque en CI.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/attesta_test
      # Services : chaque suite d'intégration crée puis supprime sa propre base jetable.
      TEST_ADMIN_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/*/package-lock.json
            gateway/package-lock.json
            frontend/package-lock.json
      # Ubuntu 24.04 restreint les espaces de noms utilisateur : sans ce réglage,
      # la sandbox de Chromium (rendu PDF de letters-export) ne démarre pas.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Paquets partagés seulement : installés et compilés à la racine. Un service, la gateway ou le frontend
      # s'installe dans son dossier.
      - if: ${{ startsWith(matrix.dir, 'packages/') }}
        run: |
          npm ci
          npm run build
      # Couverture limitée au src/ de l'unité. La porte de fidélité (évaluation en rejeu, bloquante) est dans
      # les tests de cv-generation (tests/evals-fidelite.test.ts).
      - run: node scripts/ci/tester-unite.mjs ${{ matrix.dir }}

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (tout l'historique)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

  infra:
    name: Terraform (gelé, validé seulement)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate
        run: |
          for root in infra/terraform/shared infra/terraform/environment; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  image:
    name: Pile compose, parité de bout en bout, accessibilité, vulnérabilités
    runs-on: ubuntu-24.04
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker compose --profile core up -d --build --wait
      - name: Bases et rôles cloisonnés (docs/adr/0013)
        run: bash infra/postgres/verifier-cloisonnement.sh
      - name: Vulnérabilités des images construites (critiques et hautes, corrigeables)
        # Image Docker de Trivy, version figée : l'action trivy-action dépendait d'une version de
        # setup-trivy retirée par son éditeur. Seules nos images (attesta-*) sont analysées.
        run: |
          for image in $(docker compose --profile core config --images | grep '^attesta-'); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 \
              image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --quiet "$image"
          done
      - run: node scripts/smoke.mjs http://localhost:8080
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Comptes de démonstration (recette par user story)
        run: npm run demo:seed
      - name: Suite de bout en bout (parcours, comptes, recette, accessibilité)
        run: npm run test:parite
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Aucune donnée saisie dans les journaux
        # Noms et adresses saisis par les tests E2E et par les comptes de démonstration.
        run: |
          ! docker compose --profile core logs | grep -e 'Léa' -e 'lea.martin' -e 'Camille' -e 'Amina' -e '@example.org'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose --profile core down -v
