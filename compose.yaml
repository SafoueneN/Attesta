# Environnement local : `docker compose up --build`, puis http://localhost:3080
# (port hôte modifiable : ATTESTA_PORT=9000 docker compose up).
# MailHog et le worker arrivent avec les phases qui en ont besoin (e-mail : Phase 4,
# worker pg-boss : Phase 2). Aucun service inutilisé n'est lancé.

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: attesta
      POSTGRES_USER: attesta
      POSTGRES_PASSWORD: attesta-dev-uniquement
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attesta -d attesta"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infra/Dockerfile }
    command:
      [
        "node",
        "node_modules/node-pg-migrate/bin/node-pg-migrate.js",
        "up",
        "--migrations-dir",
        "db/migrations",
        "--migration-file-language",
        "sql",
      ]
    environment:
      DATABASE_URL: postgres://attesta:attesta-dev-uniquement@db:5432/attesta
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infra/Dockerfile }
    init: true
    ports: ["${ATTESTA_PORT:-3080}:3000"]
    environment:
      DATABASE_URL: postgres://attesta:attesta-dev-uniquement@db:5432/attesta
      SESSION_STORE: postgres
      # Secret de développement : en préprod et en prod, il est injecté par l'hébergeur.
      SESSION_SECRET: dev-secret-a-remplacer-hors-poste-local-0000
      # Poste local : mode développement (cookies sans Secure sur http://localhost,
      # fournisseur de démonstration autorisé). L'image est la même qu'en production.
      NODE_ENV: development
      LOG_LEVEL: info
      # demo : génération sans IA. Pour Claude sur Vertex AI (UE), voir docs/runbook.md.
      LLM_PROVIDER: demo
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    # Sandbox de Chromium active grâce à un profil seccomp dédié (docs/adr/0009).
    security_opt: ["no-new-privileges:true", "seccomp=./infra/seccomp/chromium.json"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  db-data:
