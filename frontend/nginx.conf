# Frontend servi par nginx non-root (docs/adr/0022, point 2) : fichiers statiques, repli vers index.html pour
# les routes de l'application, et relais de /api vers la gateway (même origine : aucune CORS, cookies de
# première partie).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Progression de la génération en SSE : aucun tampon, délai long (docs/adr/0012, point 6).
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Fichiers à empreinte : cache d'un an.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html jamais en cache : une nouvelle version est servie immédiatement.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
