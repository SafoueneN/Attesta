# En-têtes de sécurité, inclus dans chaque location (nginx n'hérite pas des add_header du bloc parent
# dès qu'une location en définit un).
# CSP : aucun script en ligne ni externe ; styles en ligne admis pour l'aperçu du CV (iframe srcdoc, sandbox
# sans script) et ses polices embarquées en data URI.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
