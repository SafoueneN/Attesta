# PROPOSITION — NON AJOUTÉE AU PROJET (dossier de présentation, 2026-10-26)
# Complète .github/workflows/cd.yml, qui ne publie aujourd'hui que l'image du monolithe (infra/Dockerfile).
# Construit, scanne et pousse les images des 6 microservices, de la gateway et du frontend, une par entrée de
# matrice, vers le registre GitHub (ghcr.io), après une CI verte sur main.
# Choix :
# - ghcr.io plutôt qu'Artifact Registry : aucun compte Google Cloud requis tant que le déploiement est gelé
#   (ADR 0021) ; authentification par GITHUB_TOKEN, aucun secret à créer.
# - mêmes garde-fous que cd.yml : workflow_run de « ci » réussi, push sur main du dépôt lui-même, Trivy 0.57.0
#   bloquant sur les vulnérabilités critiques et hautes corrigeables, étiquettes immuables sha-<commit>.
# - le déploiement reste celui de cd.yml (Cloud Run) ; un job « deployer » sera à écrire quand l'hébergement
#   des microservices sera décidé (ADR à rédiger).
# Pour l'adopter : copier dans .github/workflows/, puis justifier dans une PR (règle 6 de CLAUDE.md).
name: images-microservices

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    name: Image · ${{ matrix.nom }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: auth, dockerfile: services/auth/Dockerfile }
          - { nom: profiles, dockerfile: services/profiles/Dockerfile }
          - { nom: cv-generation, dockerfile: services/cv-generation/Dockerfile }
          - { nom: jobs-matching, dockerfile: services/jobs-matching/Dockerfile }
          - { nom: job-watch, dockerfile: services/job-watch/Dockerfile }
          - { nom: letters-export, dockerfile: services/letters-export/Dockerfile }
          - { nom: gateway, dockerfile: gateway/Dockerfile }
          - { nom: frontend, dockerfile: frontend/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/attesta-${{ matrix.nom }}:sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Contexte = racine du dépôt, réduit par <Dockerfile>.dockerignore (ADR 0023) ; cache des couches GitHub.
      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
      - name: Vulnérabilités (critiques et hautes, corrigeables)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --quiet "$IMAGE"
      - name: Publication
        run: docker push "$IMAGE"
