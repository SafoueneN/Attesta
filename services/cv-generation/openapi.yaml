openapi: "3.1.0"
info:
  title: "Attesta · cv-generation"
  version: "0.1.0"
  description: "CV ciblé par offre, contrôle de fidélité et traçabilité ligne par ligne."
paths:
  "/health":
    get:
      operationId: "health"
      summary: "Vivacité : le processus répond"
      tags:
        - "santé"
      responses:
        "200":
          description: "Le processus répond"
  "/ready":
    get:
      operationId: "ready"
      summary: "Disponibilité : les dépendances répondent"
      tags:
        - "santé"
      responses:
        "200":
          description: "Prêt"
        "503":
          description: "Une dépendance ne répond pas"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
  "/v1/generations":
    post:
      operationId: "genererCv"
      summary: "Génère un CV ciblé pour une offre ; avec « Accept: text/event-stream », progression en SSE puis événement done"
      tags:
        - "génération"
      security:
        -
          bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $schema: "https://json-schema.org/draft/2020-12/schema"
              type: "object"
              properties:
                offerId:
                  type: "string"
                  format: "uuid"
                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
              required:
                - "offerId"
      responses:
        "201":
          description: "Génération (vérifiée, ou en mode dégradé)"
          content:
            "application/json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                  offerId:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                  offerTitle:
                    type: "string"
                  profileVersion:
                    anyOf:
                      -
                        type: "integer"
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      -
                        type: "null"
                  createdAt:
                    type: "string"
                  updatedAt:
                    type: "string"
                  status:
                    type: "string"
                    enum:
                      - "ok"
                      - "degraded"
                  degradedReason:
                    anyOf:
                      -
                        type: "string"
                        enum:
                          - "indisponible"
                          - "refus"
                          - "budget"
                          - "non-conforme"
                          - "quota"
                      -
                        type: "null"
                  message:
                    type:
                      - "string"
                      - "null"
                  cv:
                    anyOf:
                      -
                        type: "object"
                        properties:
                          headline:
                            type: "object"
                            properties:
                              text:
                                type: "string"
                                minLength: 1
                                maxLength: 500
                              sources:
                                minItems: 1
                                maxItems: 5
                                type: "array"
                                items:
                                  type: "string"
                                  pattern: "^(\\/[a-zA-Z]+(\\/\\d+)?)+$"
                            required:
                              - "text"
                              - "sources"
                            additionalProperties: false
                          summary:
                            maxItems: 4
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                text:
                                  type: "string"
                                  minLength: 1
                                  maxLength: 500
                                sources:
                                  minItems: 1
                                  maxItems: 5
                                  type: "array"
                                  items:
                                    type: "string"
                                    pattern: "^(\\/[a-zA-Z]+(\\/\\d+)?)+$"
                              required:
                                - "text"
                                - "sources"
                              additionalProperties: false
                          work:
                            maxItems: 15
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                ref:
                                  type: "string"
                                  pattern: "^\\/work\\/\\d+$"
                                highlights:
                                  maxItems: 20
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      text:
                                        type: "string"
                                        minLength: 1
                                        maxLength: 500
                                      sources:
                                        minItems: 1
                                        maxItems: 5
                                        type: "array"
                                        items:
                                          type: "string"
                                          pattern: "^(\\/[a-zA-Z]+(\\/\\d+)?)+$"
                                    required:
                                      - "text"
                                      - "sources"
                                    additionalProperties: false
                              required:
                                - "ref"
                                - "highlights"
                              additionalProperties: false
                          projects:
                            maxItems: 10
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                ref:
                                  type: "string"
                                  pattern: "^\\/projects\\/\\d+$"
                                highlights:
                                  maxItems: 20
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      text:
                                        type: "string"
                                        minLength: 1
                                        maxLength: 500
                                      sources:
                                        minItems: 1
                                        maxItems: 5
                                        type: "array"
                                        items:
                                          type: "string"
                                          pattern: "^(\\/[a-zA-Z]+(\\/\\d+)?)+$"
                                    required:
                                      - "text"
                                      - "sources"
                                    additionalProperties: false
                              required:
                                - "ref"
                                - "highlights"
                              additionalProperties: false
                          education:
                            maxItems: 10
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                ref:
                                  type: "string"
                                  pattern: "^\\/education\\/\\d+$"
                              required:
                                - "ref"
                              additionalProperties: false
                          skills:
                            maxItems: 30
                            type: "array"
                            items:
                              type: "string"
                              pattern: "^\\/skills\\/\\d+$"
                          languages:
                            maxItems: 10
                            type: "array"
                            items:
                              type: "string"
                              pattern: "^\\/languages\\/\\d+$"
                          certificates:
                            maxItems: 15
                            type: "array"
                            items:
                              type: "string"
                              pattern: "^\\/certificates\\/\\d+$"
                          missingKeywords:
                            maxItems: 60
                            type: "array"
                            items:
                              type: "string"
                              minLength: 1
                              maxLength: 100
                        required:
                          - "summary"
                          - "work"
                          - "projects"
                          - "education"
                          - "skills"
                          - "languages"
                          - "certificates"
                          - "missingKeywords"
                        additionalProperties: false
                      -
                        type: "null"
                  report:
                    anyOf:
                      -
                        type: "object"
                        properties:
                          score:
                            type: "number"
                            minimum: 0
                            maximum: 1
                          checkedLines:
                            type: "integer"
                            minimum: 0
                            maximum: 9007199254740991
                          supportedLines:
                            type: "integer"
                            minimum: 0
                            maximum: 9007199254740991
                          lines:
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                path:
                                  type: "string"
                                status:
                                  type: "string"
                                  enum:
                                    - "supported"
                                    - "unsupported"
                                issues:
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      kind:
                                        type: "string"
                                        enum:
                                          - "number"
                                          - "date"
                                          - "entity"
                                          - "skill"
                                          - "unresolved-source"
                                          - "foreign-source"
                                      value:
                                        type: "string"
                                    required:
                                      - "kind"
                                      - "value"
                                    additionalProperties: false
                              required:
                                - "path"
                                - "status"
                                - "issues"
                              additionalProperties: false
                        required:
                          - "score"
                          - "checkedLines"
                          - "supportedLines"
                          - "lines"
                        additionalProperties: false
                      -
                        type: "null"
                  removed:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        path:
                          type: "string"
                        text:
                          type: "string"
                        issues:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              kind:
                                type: "string"
                                enum:
                                  - "number"
                                  - "date"
                                  - "entity"
                                  - "skill"
                                  - "unresolved-source"
                                  - "foreign-source"
                              value:
                                type: "string"
                            required:
                              - "kind"
                              - "value"
                            additionalProperties: false
                      required:
                        - "path"
                        - "text"
                        - "issues"
                      additionalProperties: false
                  edited:
                    type: "array"
                    items:
                      type: "string"
                  revision:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  analysis:
                    anyOf:
                      -
                        type: "object"
                        properties:
                          title:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          company:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          language:
                            type: "string"
                            enum:
                              - "fr"
                              - "de"
                              - "en"
                          location:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          contractType:
                            type: "string"
                            enum:
                              - "cdi"
                              - "cdd"
                              - "freelance"
                              - "stage"
                              - "alternance"
                              - "autre"
                          requirements:
                            maxItems: 40
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                text:
                                  type: "string"
                                  minLength: 1
                                  maxLength: 300
                                priority:
                                  type: "string"
                                  enum:
                                    - "must"
                                    - "nice"
                                skills:
                                  maxItems: 10
                                  type: "array"
                                  items:
                                    type: "string"
                                    minLength: 1
                                    maxLength: 200
                              required:
                                - "text"
                                - "priority"
                                - "skills"
                              additionalProperties: false
                          keywords:
                            maxItems: 60
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                term:
                                  type: "string"
                                  minLength: 1
                                  maxLength: 200
                                weight:
                                  type: "number"
                                  minimum: 0
                                  maximum: 1
                              required:
                                - "term"
                                - "weight"
                              additionalProperties: false
                        required:
                          - "title"
                          - "language"
                          - "requirements"
                          - "keywords"
                        additionalProperties: false
                      -
                        type: "null"
                  profile:
                    type: "object"
                    properties:
                      basics:
                        type: "object"
                        properties:
                          name:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          label:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          email:
                            type: "string"
                            format: "email"
                            pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                          phone:
                            type: "string"
                            maxLength: 40
                          url:
                            type: "string"
                            format: "uri"
                          summary:
                            type: "string"
                            minLength: 1
                            maxLength: 2000
                          location:
                            type: "object"
                            properties:
                              city:
                                type: "string"
                                maxLength: 100
                              region:
                                type: "string"
                                maxLength: 100
                              countryCode:
                                type: "string"
                                pattern: "^[A-Z]{2}$"
                            additionalProperties: false
                          profiles:
                            default: []
                            maxItems: 10
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                network:
                                  type: "string"
                                  minLength: 1
                                  maxLength: 200
                                url:
                                  type: "string"
                                  format: "uri"
                              required:
                                - "network"
                                - "url"
                              additionalProperties: false
                        required:
                          - "name"
                          - "profiles"
                        additionalProperties: false
                      work:
                        default: []
                        maxItems: 30
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            position:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            url:
                              type: "string"
                              format: "uri"
                            location:
                              type: "string"
                              maxLength: 100
                            startDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            endDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            summary:
                              type: "string"
                              minLength: 1
                              maxLength: 2000
                            highlights:
                              default: []
                              maxItems: 20
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 500
                          required:
                            - "name"
                            - "position"
                            - "startDate"
                            - "highlights"
                          additionalProperties: false
                      education:
                        default: []
                        maxItems: 15
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            institution:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            area:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            studyType:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            startDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            endDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            score:
                              type: "string"
                              maxLength: 50
                            courses:
                              default: []
                              maxItems: 20
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 200
                          required:
                            - "institution"
                            - "courses"
                          additionalProperties: false
                      skills:
                        default: []
                        maxItems: 50
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            level:
                              type: "string"
                              maxLength: 50
                            keywords:
                              default: []
                              maxItems: 30
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 200
                          required:
                            - "name"
                            - "keywords"
                          additionalProperties: false
                      languages:
                        default: []
                        maxItems: 15
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            language:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            fluency:
                              type: "string"
                              maxLength: 50
                          required:
                            - "language"
                          additionalProperties: false
                      projects:
                        default: []
                        maxItems: 30
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            description:
                              type: "string"
                              minLength: 1
                              maxLength: 2000
                            highlights:
                              default: []
                              maxItems: 20
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 500
                            startDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            endDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            url:
                              type: "string"
                              format: "uri"
                          required:
                            - "name"
                            - "highlights"
                          additionalProperties: false
                      certificates:
                        default: []
                        maxItems: 30
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            issuer:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            date:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            url:
                              type: "string"
                              format: "uri"
                          required:
                            - "name"
                          additionalProperties: false
                    required:
                      - "basics"
                      - "work"
                      - "education"
                      - "skills"
                      - "languages"
                      - "projects"
                      - "certificates"
                    additionalProperties: false
                  providerKind:
                    type: "string"
                    enum:
                      - "ia"
                      - "demo"
                  model:
                    type: "string"
                  pipelineVersion:
                    type: "string"
                required:
                  - "id"
                  - "offerId"
                  - "offerTitle"
                  - "profileVersion"
                  - "createdAt"
                  - "updatedAt"
                  - "status"
                  - "degradedReason"
                  - "message"
                  - "cv"
                  - "report"
                  - "removed"
                  - "edited"
                  - "revision"
                  - "analysis"
                  - "profile"
                  - "providerKind"
                  - "model"
                  - "pipelineVersion"
                additionalProperties: false
        "404":
          description: "Offre inconnue"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
        "409":
          description: "Profil absent, ou génération déjà en cours"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
        "429":
          description: "Quota quotidien atteint"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
    get:
      operationId: "mesGenerations"
      summary: "Historique des générations"
      tags:
        - "génération"
      security:
        -
          bearer: []
      responses:
        "200":
          description: "Générations"
          content:
            "application/json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "array"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                      format: "uuid"
                      pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                    offerTitle:
                      type: "string"
                    createdAt:
                      type: "string"
                    status:
                      type: "string"
                      enum:
                        - "ok"
                        - "degraded"
                    score:
                      type:
                        - "number"
                        - "null"
                    providerKind:
                      type: "string"
                      enum:
                        - "ia"
                        - "demo"
                  required:
                    - "id"
                    - "offerTitle"
                    - "createdAt"
                    - "status"
                    - "score"
                    - "providerKind"
                  additionalProperties: false
  "/v1/generations/{id}":
    get:
      operationId: "uneGeneration"
      summary: "Génération, rapport de fidélité et trace des lignes écartées"
      tags:
        - "génération"
      security:
        -
          bearer: []
      responses:
        "200":
          description: "Génération"
          content:
            "application/json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
