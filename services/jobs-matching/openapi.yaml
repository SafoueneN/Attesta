                    title:
                      type: "string"
                    company:
                      type:
                        - "string"
                        - "null"
                    createdAt:
                      type: "string"
                    keywords:
                      type: "integer"
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                  required:
                    - "id"
                    - "title"
                    - "company"
                    - "createdAt"
                    - "keywords"
                  additionalProperties: false
