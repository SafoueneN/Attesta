openapi: "3.1.0"
info:
  title: "Attesta · jobs-matching"
  version: "0.1.0"
  description: "Offres, analyse, ESCO, vecteurs pgvector et classement."
paths:
  "/health":
    get:
      operationId: "health"
      summary: "Vivacité : le processus répond"
      tags:
        - "santé"
      responses:
        "200":
          description: "Le processus répond"
  "/ready":
    get:
      operationId: "ready"
      summary: "Disponibilité : les dépendances répondent"
      tags:
        - "santé"
      responses:
        "200":
          description: "Prêt"
        "503":
          description: "Une dépendance ne répond pas"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
  "/v1/offers":
    post:
      operationId: "enregistrerOffre"
      summary: "Enregistre une offre collée et l'analyse (exigences, mots-clés)"
      tags:
        - "offres"
      security:
        -
          bearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $schema: "https://json-schema.org/draft/2020-12/schema"
              type: "object"
              properties:
                rawText:
                  type: "string"
                  minLength: 50
                  maxLength: 20000
                sourceUrl:
                  type: "string"
                  format: "uri"
              required:
                - "rawText"
      responses:
        "201":
          description: "Offre analysée"
          content:
            "application/json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                  title:
                    type: "string"
                  company:
                    type:
                      - "string"
                      - "null"
                  createdAt:
                    type: "string"
                  sourceUrl:
                    type:
                      - "string"
                      - "null"
                  rawText:
                    type: "string"
                  analysis:
                    type: "object"
                    properties:
                      title:
                        type: "string"
                        minLength: 1
                        maxLength: 200
                      company:
                        type: "string"
                        minLength: 1
                        maxLength: 200
                      language:
                        type: "string"
                        enum:
                          - "fr"
                          - "de"
                          - "en"
                      location:
                        type: "string"
                        minLength: 1
                        maxLength: 200
                      contractType:
                        type: "string"
                        enum:
                          - "cdi"
                          - "cdd"
                          - "freelance"
                          - "stage"
                          - "alternance"
                          - "autre"
                      requirements:
                        maxItems: 40
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            text:
                              type: "string"
                              minLength: 1
                              maxLength: 300
                            priority:
                              type: "string"
                              enum:
                                - "must"
                                - "nice"
                            skills:
                              maxItems: 10
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 200
                          required:
                            - "text"
                            - "priority"
                            - "skills"
                          additionalProperties: false
                      keywords:
                        maxItems: 60
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            term:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            weight:
                              type: "number"
                              minimum: 0
                              maximum: 1
                          required:
                            - "term"
                            - "weight"
                          additionalProperties: false
                    required:
                      - "title"
                      - "language"
                      - "requirements"
                      - "keywords"
                    additionalProperties: false
                  providerKind:
                    type: "string"
                    enum:
                      - "ia"
                      - "demo"
                  postingId:
                    anyOf:
                      -
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      -
                        type: "null"
                required:
                  - "id"
                  - "title"
                  - "company"
                  - "createdAt"
                  - "sourceUrl"
                  - "rawText"
                  - "analysis"
                  - "providerKind"
                  - "postingId"
                additionalProperties: false
        "400":
          description: "Offre invalide"
          content:
            "application/problem+json":
              schema:
                $schema: "https://json-schema.org/draft/2020-12/schema"
                type: "object"
                properties:
                  type:
                    type: "string"
                  title:
                    type: "string"
                  status:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        champ:
                          type: "string"
                        message:
                          type: "string"
                      required:
                        - "champ"
                        - "message"
                      additionalProperties: false
                  requestId:
                    type: "string"
                required:
                  - "type"
                  - "title"
                  - "status"
                additionalProperties: false
    get:
      operationId: "mesOffres"
      summary: "Offres enregistrées par l'utilisateur, des plus récentes aux plus anciennes"
      tags:
        - "offres"
      security:
        -
          bearer: []
      responses:
