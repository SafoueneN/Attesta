                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  createdAt:
                    type: "string"
                  schemaVersion:
                    type: "string"
                  profile:
                    type: "object"
                    properties:
                      basics:
                        type: "object"
                        properties:
                          name:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          label:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          email:
                            type: "string"
                            format: "email"
                            pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                          phone:
                            type: "string"
                            maxLength: 40
                          url:
                            type: "string"
                            format: "uri"
                          summary:
                            type: "string"
                            minLength: 1
                            maxLength: 2000
                          location:
                            type: "object"
                            properties:
                              city:
                                type: "string"
                                maxLength: 100
                              region:
                                type: "string"
                                maxLength: 100
                              countryCode:
                                type: "string"
                                pattern: "^[A-Z]{2}$"
                            additionalProperties: false
                          profiles:
                            default: []
                            maxItems: 10
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                network:
                                  type: "string"
                                  minLength: 1
                                  maxLength: 200
                                url:
                                  type: "string"
                                  format: "uri"
                              required:
                                - "network"
                                - "url"
                              additionalProperties: false
                        required:
                          - "name"
                          - "profiles"
                        additionalProperties: false
                      work:
                        default: []
                        maxItems: 30
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            position:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            url:
                              type: "string"
                              format: "uri"
                            location:
                              type: "string"
                              maxLength: 100
                            startDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            endDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            summary:
