                              minLength: 1
                              maxLength: 200
                            fluency:
                              type: "string"
                              maxLength: 50
                          required:
                            - "language"
                          additionalProperties: false
                      projects:
                        default: []
                        maxItems: 30
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              minLength: 1
                              maxLength: 200
                            description:
                              type: "string"
                              minLength: 1
                              maxLength: 2000
                            highlights:
                              default: []
                              maxItems: 20
                              type: "array"
                              items:
                                type: "string"
                                minLength: 1
                                maxLength: 500
                            startDate:
                              type: "string"
                              pattern: "^\\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?)?$"
                            endDate:
