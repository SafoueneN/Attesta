                  profile:
                    type: "object"
                    properties:
                      basics:
                        type: "object"
                        properties:
                          name:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          label:
                            type: "string"
                            minLength: 1
                            maxLength: 200
                          email:
